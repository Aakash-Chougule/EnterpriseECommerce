services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:17
    container_name: enterprise-postgres

    environment:
      POSTGRES_DB: EnterpriseECommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - enterprise_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d EnterpriseECommerce"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # ZOOKEEPER
  # ==========================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: enterprise-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    restart: unless-stopped


  # ==========================================================
  # KAFKA
  # ==========================================================

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: enterprise-kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT:
        zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:
        INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS:
        INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS:
        INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME:
        INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    restart: unless-stopped


  # ==========================================================
  # ASP.NET CORE API
  # ==========================================================

  api:
    build:
      context: .
      dockerfile:
        src/EnterpriseECommerce.API/Dockerfile

    container_name:
      enterprise-api

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    environment:

      ASPNETCORE_ENVIRONMENT:
        Development

      ConnectionStrings__DefaultConnection:
        Host=postgres;Port=5432;Database=EnterpriseECommerce;Username=postgres;Password=${POSTGRES_PASSWORD}

      Jwt__SecretKey:
        ${JWT_SECRET_KEY}

      Jwt__Issuer:
        EnterpriseECommerce.API

      Jwt__Audience:
        EnterpriseECommerce.Client

      Kafka__BootstrapServers:
        kafka:29092

      Kafka__OrderEventsTopic:
        order-events

      Kafka__PaymentEventsTopic:
        payment-events

      Kafka__OrderStatusEventsTopic:
        order-status-events

    ports:
      - "8080:8080"

    restart: unless-stopped


  # ==========================================================
  # NOTIFICATION SERVICE
  # ==========================================================

  notification-service:

    build:
      context: .
      dockerfile:
        src/EnterpriseECommerce.NotificationService/Dockerfile

    container_name:
      enterprise-notification-service

    depends_on:
      kafka:
        condition: service_started

    environment:

      Kafka__BootstrapServers:
        kafka:29092

      Kafka__GroupId:
        notification-service-group

      Kafka__OrderEventsTopic:
        order-events

      Kafka__PaymentEventsTopic:
        payment-events

      Kafka__OrderStatusEventsTopic:
        order-status-events

      Email__SmtpHost:
        smtp.gmail.com

      Email__SmtpPort:
        587

      Email__Username:
        ${EMAIL_USERNAME}

      Email__Password:
        ${EMAIL_PASSWORD}

      Email__FromEmail:
        ${EMAIL_USERNAME}

    restart: unless-stopped


  # ==========================================================
  # REACT FRONTEND
  # ==========================================================

  client:

    build:
      context: .
      dockerfile:
        client/Dockerfile

    container_name:
      enterprise-client

    depends_on:
      - api

    ports:
      - "3000:80"

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================

volumes:

  enterprise_postgres_data: